<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giddie Rey Journal</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #080808;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 25px;
    }

    .home {
      width: 100%;
      max-width: 500px;
    }

    .tag {
      color: #777;
      letter-spacing: 4px;
      font-size: 12px;
      margin-bottom: 25px;
      text-transform: uppercase;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 18px;
    }

    .intro {
      color: #aaa;
      line-height: 1.7;
      margin-bottom: 35px;
    }

    .enter {
      display: inline-block;
      padding: 16px 35px;
      background: white;
      color: black;
      text-decoration: none;
      border-radius: 30px;
      font-weight: bold;
      transition: 0.3s;
    }

    .enter:hover {
      transform: scale(1.05);
      background: #ddd;
    }

    .footer {
      margin-top: 60px;
      color: #555;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <main class="home">

    <div class="tag">Giddie Rey Journal</div>

    <h1>Welcome to the Journal</h1>

    <p class="intro">
      Words for the feelings we struggle to explain.
      Stories of love, loneliness, heartbreak, healing and life.
    </p>

    <a class="enter" href="journal.html">
      ENTER THE JOURNAL
    </a>

    <div class="footer">
      © 2026 Giddie Rey Journal
    </div>

  </main>

</body>
</html>
