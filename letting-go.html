<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Letting Go — Giddie Rey Journal</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #080808;
      color: white;
      font-family: Arial, sans-serif;
      padding: 25px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: auto;
    }

    h1 {
      text-align: center;
      font-size: 32px;
      margin: 20px 0 10px;
    }

    .intro {
      text-align: center;
      color: #999;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .quote {
      background: #151515;
      border: 1px solid #292929;
      border-radius: 15px;
      padding: 20px;
      margin: 12px 0;
      color: #ddd;
      line-height: 1.6;
      cursor: pointer;
      transition: 0.3s;
    }

    .quote:hover {
      background: #202020;
      transform: translateY(-2px);
    }

    .back {
      display: block;
      text-align: center;
      margin: 30px 0 10px;
      color: #888;
      text-decoration: none;
    }

    #quoteScreen {
      display: none;
      position: fixed;
      inset: 0;
      background: #050505;
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    .screenContent {
      width: 100%;
      max-width: 600px;
      text-align: center;
    }

    .number {
      color: #666;
      font-size: 13px;
      letter-spacing: 2px;
      margin-bottom: 35px;
    }

    #fullQuote {
      font-size: 26px;
      line-height: 1.6;
      margin-bottom: 45px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      border: none;
      padding: 13px 20px;
      border-radius: 25px;
      background: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    .close {
      background: #222;
      color: white;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🚪 Letting Go</h1>

    <p class="intro">
      Some things leave your life so you can finally
      make room for what comes next.
    </p>

    <div id="quoteList"></div>

    <a class="back" href="journal.html">← Back to Journal</a>

  </div>

  <div id="quoteScreen">

    <div class="screenContent">

      <div class="number" id="quoteNumber"></div>

      <div id="fullQuote"></div>

      <div class="buttons">
        <button onclick="previousQuote()">← Previous</button>
        <button onclick="nextQuote()">Next →</button>
        <button class="close" onclick="closeQuote()">✕ Back</button>
      </div>

    </div>

  </div>

  <script>

      "Not every ending needs another chance.",

      "I can forgive without returning to the same situation.",

      "Sometimes distance gives clarity that closeness never could.",

      "Letting go is easier when you stop romanticizing what hurt you.",

      "I am learning to remember things honestly, not only beautifully.",

      "Some attachments survive because we fear what life will look like without them.",

      "Sometimes the unknown is healthier than the familiar.",

      "I do not need to understand every ending before accepting it.",

      "Some things are not meant to be fixed; they are meant to be released.",

      "Letting go can be an act of self-respect.",

      "I am learning that peace sometimes requires walking away.",

      "You can care about someone and still choose a different path.",

      "Some endings are messy because real life is messy.",

      "You can move on without becoming cold.",

      "Some endings create opportunities I could not have imagined before.",

      "The moment I stop forcing what is not working, I can finally notice what is.",

      "I am learning that peace can be a destination too.",

      "There is freedom in no longer needing the past to change.",

      "Sometimes acceptance is the final gift we give ourselves.",

      "I can honor what happened and still choose what happens next.",

      "The past taught me enough. I do not need to live there anymore.",

      "Some doors close so I can finally notice another one opening.",

      "I am learning to trust the space created by letting go.",

      "Not everything needs to come with me.",

      "Some things belong exactly where they are: behind me.",

      "Sometimes the bravest thing is to stop holding on.",

      "It is simply the moment I decide to turn the page."

    ];

    const quoteList = document.getElementById("quoteList");

    quotes.forEach((quote, index) => {
      const div = document.createElement("div");
      div.className = "quote";
      div.textContent = quote;
      div.onclick = () => openQuote(index);
      quoteList.appendChild(div);
    });

    let currentQuote = 0;

    function openQuote(index) {
      currentQuote = index;

      document.getElementById("fullQuote").textContent =
        quotes[currentQuote];

      document.getElementById("quoteNumber").textContent =
        "QUOTE " +
        String(currentQuote + 1).padStart(3, "0") +
        " OF " +
        quotes.length;

      document.getElementById("quoteScreen").style.display = "flex";
    }

    function closeQuote() {
      document.getElementById("quoteScreen").style.display = "none";
    }

    function nextQuote() {
      currentQuote++;

      if (currentQuote >= quotes.length) {
        currentQuote = 0;
      }

      openQuote(currentQuote);
    }

    function previousQuote() {
      currentQuote--;

      if (currentQuote < 0) {
        currentQuote = quotes.length - 1;
      }

      openQuote(currentQuote);
    }

  </script>

</body>
</html>
