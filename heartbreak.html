<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heartbreak — Giddie Rey Journal</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #080808;
      color: white;
      font-family: Arial, sans-serif;
      padding: 25px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: auto;
    }

    h1 {
      text-align: center;
      font-size: 32px;
      margin: 20px 0 10px;
    }

    .intro {
      text-align: center;
      color: #999;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .quote {
      background: #151515;
      border: 1px solid #292929;
      border-radius: 15px;
      padding: 20px;
      margin: 12px 0;
      color: #ddd;
      line-height: 1.6;
      cursor: pointer;
      transition: 0.3s;
    }

    .quote:hover {
      background: #202020;
      transform: translateY(-2px);
    }

    .back {
      display: block;
      text-align: center;
      margin: 30px 0 10px;
      color: #888;
      text-decoration: none;
    }

    #quoteScreen {
      display: none;
      position: fixed;
      inset: 0;
      background: #050505;
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    .screenContent {
      width: 100%;
      max-width: 600px;
      text-align: center;
    }

    .number {
      color: #666;
      font-size: 13px;
      letter-spacing: 2px;
      margin-bottom: 35px;
    }

    #fullQuote {
      font-size: 26px;
      line-height: 1.6;
      margin-bottom: 35px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      border: none;
      padding: 13px 20px;
      border-radius: 25px;
      background: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    .save {
      background: #b00020;
      color: white;
    }

    .saved {
      background: #333;
      color: white;
    }

    .close {
      background: #222;
      color: white;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🥀 Heartbreak</h1>

    <p class="intro">
      Some feelings hurt because they once meant everything.
    </p>

    <div id="quoteList"></div>

    <a class="back" href="journal.html">← Back to Journal</a>

  </div>

  <div id="quoteScreen">

    <div class="screenContent">

      <div class="number" id="quoteNumber"></div>

      <div id="fullQuote"></div>

      <div class="buttons">

        <button onclick="previousQuote()">← Previous</button>

        <button onclick="nextQuote()">Next →</button>

        <button id="saveButton" class="save" onclick="saveQuote()">
          ❤️ Save
        </button>

        <button class="close" onclick="closeQuote()">
          ✕ Back
        </button>

      </div>

    </div>

  </div>

  <script>

    const quotes = [

      "Sometimes the hardest goodbye is the one you never got to say.",
      "I miss what we were, even though I know we cannot go back.",
      "Some memories stay long after the person has left.",
      "It hurts when someone becomes a stranger after once feeling like home.",
      "Not every ending comes with an explanation.",
      "Sometimes you have to accept that the person you wanted is no longer part of your story.",
      "The hardest part is remembering the good days while knowing they are over.",
      "You can forgive someone and still choose not to return.",
      "Some people leave quietly, but their absence speaks loudly.",
      "I learned that missing someone does not always mean you should go back.",
      "A goodbye can change everything in a single moment.",
      "Sometimes the heart needs time to understand what the mind already knows.",
      "It is strange how someone can mean so much and become a memory.",
      "I stopped waiting for an explanation that was never coming.",
      "Some endings hurt because they were never meant to happen.",
      "You cannot force someone to stay where they no longer want to be.",
      "The memories are beautiful, but they belong to yesterday.",
      "Sometimes letting go is the only way to make room for peace.",
      "I wish some moments could have lasted longer.",
      "The hardest thing is accepting that things have changed.",
      "Some people teach you love, while others teach you how to let go.",
      "I remember the person you were before everything changed.",
      "Sometimes closure is simply accepting that there will be no closure.",
      "The heart remembers things the mind tries to forget.",
      "It is okay to miss someone without bringing them back into your life.",
      "Some chapters end before we are ready to turn the page.",
      "I wanted forever, but life gave me a memory.",
      "You can care about someone and still choose yourself.",
      "Some wounds need patience, not another conversation.",
      "The silence after goodbye can feel louder than the goodbye itself.",
      "I learned that not every promise survives time.",
      "Sometimes people change, and sometimes we finally notice.",
      "What once felt permanent can become a distant memory.",
      "I stopped asking why and started accepting what happened.",
      "Some connections are meant to teach us, not stay with us.",
      "The hardest memories are often the ones we once treasured.",
      "You do not have to hate someone to move on from them.",
      "Sometimes the best thing you can do is stop looking back.",
      "I still remember, but remembering no longer has to mean returning.",
      "Some goodbyes are painful because they make room for something new.",
      "You cannot rewrite yesterday, but you can choose what tomorrow becomes.",
      "Sometimes losing a connection helps you understand yourself better.",
      "I wanted answers, but eventually I learned to live without them.",
      "The past can be meaningful without becoming your future.",
      "Some memories fade slowly, and that is okay.",
      "Healing begins when you stop fighting what you cannot change.",
      "You deserve peace even when your heart still has questions.",
      "One day the memory will feel lighter than it does today.",
      "An ending can hurt and still be the beginning of something better."

    ];

    const quoteList = document.getElementById("quoteList");

    quotes.forEach((quote, index) => {

      const div = document.createElement("div");

      div.className = "quote";
      div.textContent = quote;

      div.onclick = () => openQuote(index);

      quoteList.appendChild(div);

    });

    let currentQuote = 0;

    function openQuote(index) {

      currentQuote = index;

      document.getElementById("fullQuote").textContent =
        quotes[currentQuote];

      document.getElementById("quoteNumber").textContent =
        "QUOTE " +
        String(currentQuote + 1).padStart(3, "0") +
        " OF " +
        quotes.length;

      updateSaveButton();

      document.getElementById("quoteScreen").style.display = "flex";
    }

    function closeQuote() {
      document.getElementById("quoteScreen").style.display = "none";
    }

    function nextQuote() {

      currentQuote++;

      if (currentQuote >= quotes.length) {
        currentQuote = 0;
      }

      openQuote(currentQuote);
    }

    function previousQuote() {

      currentQuote--;

      if (currentQuote < 0) {
        currentQuote = quotes.length - 1;
      }

      openQuote(currentQuote);
    }

    function getSavedQuotes() {

      return JSON.parse(
        localStorage.getItem("giddieSavedQuotes")
      ) || [];

    }

    function saveQuote() {

      let savedQuotes = getSavedQuotes();

      const quote = quotes[currentQuote];

      if (!savedQuotes.includes(quote)) {

        savedQuotes.push(quote);

        localStorage.setItem(
          "giddieSavedQuotes",
          JSON.stringify(savedQuotes)
        );

      }

      updateSaveButton();
    }

    function updateSaveButton() {

      const button = document.getElementById("saveButton");

      const savedQuotes = getSavedQuotes();

      if (savedQuotes.includes(quotes[currentQuote])) {

        button.textContent = "✓ Saved";
        button.className = "saved";

      } else {

        button.textContent = "❤️ Save";
        button.className = "save";

      }
    }

  </script>

</body>
    </html>
