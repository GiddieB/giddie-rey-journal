<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heartbreak | Giddie Rey Journal</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#080808;
  color:white;
  font-family:Arial,sans-serif;
  min-height:100vh;
  padding:25px 15px 50px;
}

.container{
  max-width:650px;
  margin:auto;
}

.header{
  text-align:center;
  margin-bottom:30px;
}

.header h1{
  font-size:35px;
  margin-bottom:10px;
}

.header p{
  color:#888;
  line-height:1.6;
}

.quote{
  background:#121212;
  border:1px solid #292929;
  border-radius:16px;
  padding:20px;
  margin-bottom:13px;
  cursor:pointer;
  line-height:1.6;
  transition:.25s;
}

.quote:hover{
  background:#1c1c1c;
}

.number{
  display:block;
  color:#666;
  font-size:12px;
  margin-bottom:7px;
}

.back{
  display:block;
  text-align:center;
  color:#aaa;
  text-decoration:none;
  margin-top:30px;
}

.footer{
  text-align:center;
  color:#444;
  font-size:12px;
  margin-top:35px;
}

/* FULL QUOTE */

#quoteScreen{
  display:none;
  position:fixed;
  inset:0;
  background:#080808;
  z-index:1000;
  padding:25px;
}

.quoteContent{
  min-height:90vh;
  max-width:650px;
  margin:auto;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.close{
  position:absolute;
  top:20px;
  left:20px;
  background:none;
  border:none;
  color:#aaa;
  font-size:16px;
  padding:10px;
}

.quoteNumber{
  color:#666;
  font-size:13px;
}

#bigQuote{
  font-size:27px;
  line-height:1.6;
  margin:30px 0;
}

.buttons{
  display:flex;
  gap:12px;
}

.buttons button{
  background:#171717;
  border:1px solid #303030;
  color:white;
  padding:13px 20px;
  border-radius:25px;
  font-size:14px;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>🥀 Heartbreak</h1>
    <p>Tap a quote to read it on its own.</p>
  </div>

  <div id="quoteList"></div>

  <a class="back" href="journal.html">← Back to Journal</a>

  <div class="footer">
    Giddie Rey Journal 🖤
  </div>

</div>


<div id="quoteScreen">

  <button class="close" onclick="closeQuote()">← Back</button>

  <div class="quoteContent">

    <div class="quoteNumber" id="quoteNumber"></div>

    <div id="bigQuote"></div>

    <div class="buttons">
      <button onclick="previousQuote()">← Previous</button>
      <button onclick="nextQuote()">Next →</button>
    </div>

  </div>

</div>

let currentQuote = 0;

const quoteList = document.getElementById("quoteList");

quotes.forEach(function(quote,index){

  const item = document.createElement("div");

  item.className = "quote";

  item.innerHTML =
    '<span class="number">' +
    String(index + 1).padStart(2,"0") +
    '</span>' +
    quote;

  item.onclick = function(){
    openQuote(index);
  };

  quoteList.appendChild(item);

});


function openQuote(index){

  currentQuote = index;

  document.getElementById("bigQuote").textContent =
    quotes[currentQuote];

  document.getElementById("quoteNumber").textContent =
    "QUOTE " +
    String(currentQuote + 1).padStart(2,"0") +
    " OF " +
    quotes.length;

  document.getElementById("quoteScreen").style.display = "block";

}


function closeQuote(){

  document.getElementById("quoteScreen").style.display = "none";

}


function nextQuote(){

  currentQuote++;

  if(currentQuote >= quotes.length){
    currentQuote = 0;
  }

  openQuote(currentQuote);

}


function previousQuote(){

  currentQuote--;

  if(currentQuote < 0){
    currentQuote = quotes.length - 1;
  }

  openQuote(currentQuote);

}

</script>

</body>
</html>
