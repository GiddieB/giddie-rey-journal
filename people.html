  <style>

    button {
      border: none;
      padding: 13px 20px;
      border-radius: 25px;
      background: white;
      color: black;

      cursor: pointer;
    }

    .close {

    }
  </style>
</head>

    <p class="intro">

    <div id="quoteList"></div>

    const quoteList = document.getElementById("quoteList");

    quotes.forEach((quote, index) => {

      const div = document.createElement("div");

      div.className = "quote";

      div.textContent = quote;

      div.onclick = () => openQuote(index);

      quoteList.appendChild(div);

    });

    let currentQuote = 0;

    function openQuote(index) {

      currentQuote = index;

      document.getElementById("fullQuote").textContent =
        quotes[currentQuote];

      document.getElementById("quoteNumber").textContent =
        "QUOTE " +
        String(currentQuote + 1).padStart(3, "0") +
        " OF " +
        quotes.length;

      document.getElementById("quoteScreen").style.display = "flex";

    }

    function closeQuote() {
      document.getElementById("quoteScreen").style.display = "none";
    }

    function nextQuote() {

      currentQuote++;

      if (currentQuote >= quotes.length) {
        currentQuote = 0;
      }

      openQuote(currentQuote);

    }

    function previousQuote() {

      currentQuote--;

      if (currentQuote < 0) {
        currentQuote = quotes.length - 1;
      }

      openQuote(currentQuote);

    }

  </script>

  </html>
