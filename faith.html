      color: #ddd;
      line-height: 1.6;

      transition: 0.3s;
    }

    .quote:hover {
      background: #202020;

    }

    .back {

      text-align: center;
      margin: 30px 0 10px;
      color: #888;
      text-decoration: none;
    }

    #quoteScreen {
      display: none;
      position: fixed;
      inset: 0;
      background: #050505;
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    .screenContent {
      width: 100%;
      max-width: 600px;
      text-align: center;
    }

    .number {
      color: #666;
      font-size: 13px;
      letter-spacing: 2px;
      margin-bottom: 35px;
    }

    #fullQuote {
      font-size: 26px;
      line-height: 1.6;
      margin-bottom: 45px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      border: none;
      padding: 13px 20px;
      border-radius: 25px;
      background: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    .close {

    }

</head>

    const quoteList = document.getElementById("quoteList");

    quotes.forEach((quote, index) => {
      const div = document.createElement("div");
      div.className = "quote";
      div.textContent = quote;
      div.onclick = () => openQuote(index);
      quoteList.appendChild(div);
    });

    let currentQuote = 0;

    function openQuote(index) {
      currentQuote = index;

      document.getElementById("fullQuote").textContent =
        quotes[currentQuote];

      document.getElementById("quoteNumber").textContent =
        "QUOTE " +
        String(currentQuote + 1).padStart(3, "0") +
        " OF " +
        quotes.length;

      document.getElementById("quoteScreen").style.display = "flex";
    }

    function closeQuote() {
      document.getElementById("quoteScreen").style.display = "none";
    }

    function nextQuote() {
      currentQuote++;

      if (currentQuote >= quotes.length) {
        currentQuote = 0;
      }

      openQuote(currentQuote);
    }

    function previousQuote() {
      currentQuote--;

      if (currentQuote < 0) {
        currentQuote = quotes.length - 1;
      }

      openQuote(currentQuote);
    }
