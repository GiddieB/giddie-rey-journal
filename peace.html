<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peace — Giddie Rey Journal</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #080808;
      color: white;
      font-family: Arial, sans-serif;
      padding: 25px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: auto;
    }

    h1 {
      text-align: center;
      font-size: 32px;
      margin: 20px 0 10px;
    }

    .intro {
      text-align: center;
      color: #999;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .quote {
      background: #151515;
      border: 1px solid #292929;
      border-radius: 15px;
      padding: 20px;
      margin: 12px 0;
      color: #ddd;
      line-height: 1.6;
      cursor: pointer;
      transition: 0.3s;
    }

    .quote:hover {
      background: #202020;
      transform: translateY(-2px);
    }

    .back {
      display: block;
      text-align: center;
      margin: 30px 0 10px;
      color: #888;
      text-decoration: none;
    }

    #quoteScreen {
      display: none;
      position: fixed;
      inset: 0;
      background: #050505;
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    .screenContent {
      width: 100%;
      max-width: 600px;
      text-align: center;
    }

    .number {
      color: #666;
      font-size: 13px;
      letter-spacing: 2px;
      margin-bottom: 35px;
    }

    #fullQuote {
      font-size: 26px;
      line-height: 1.6;
      margin-bottom: 45px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      border: none;
      padding: 13px 20px;
      border-radius: 25px;
      background: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    .close {
      background: #222;
      color: white;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🕊️ Peace</h1>

    <p class="intro">
      Sometimes peace begins when you stop fighting what you cannot control.
    </p>

    <div id="quoteList"></div>

    <a class="back" href="journal.html">← Back to Journal</a>

  </div>

  <div id="quoteScreen">

    <div class="screenContent">

      <div class="number" id="quoteNumber"></div>

      <div id="fullQuote"></div>

      <div class="buttons">
        <button onclick="previousQuote()">← Previous</button>
        <button onclick="nextQuote()">Next →</button>
        <button class="close" onclick="closeQuote()">✕ Back</button>
      </div>

    </div>

  </div>

  <script>

    const quotes = [

      "Peace is realizing that not everything deserves a response.",

      "Sometimes protecting your peace means walking away without explaining yourself.",

      "I stopped chasing answers when I realized some questions were never meant to be answered.",

      "Peace feels different when you finally stop trying to control everything.",

      "Not every goodbye needs anger. Some endings simply need acceptance.",

      "I would rather have a quiet life than a loud life filled with unnecessary drama.",

      "Sometimes the strongest thing you can do is remain calm.",

      "You don't have to attend every argument you are invited to.",

      "Peace begins when you stop needing everyone to understand you.",

      "Some people only disturb your peace because you keep giving them access to it.",

      "I learned that silence can be more powerful than an explanation.",

      "You can care about someone and still choose distance.",

      "A peaceful heart doesn't mean a problem-free life.",

      "Sometimes peace looks like choosing not to reply.",

      "I stopped forcing things and started letting life unfold.",

      "There is freedom in accepting what you cannot change.",

      "My peace became more important than proving my point.",

      "You don't need closure from everyone. Sometimes acceptance is enough.",

      "I no longer chase people who make me question my worth.",

      "Peace is knowing when enough is enough.",

      "Some chapters end quietly because they have already said everything they needed to say.",

      "I don't want revenge. I want peace.",

      "Growing up taught me that not every battle deserves my energy.",

      "Sometimes you find peace when you stop expecting people to behave the way you would.",

      "I am learning to leave things where they ended.",

      "A calm mind can see what an emotional heart cannot.",

      "I don't need to win every argument. I just need to protect my peace.",

      "Peace is choosing yourself without needing permission.",

      "Some distance is not hatred. Sometimes it is healing.",

      "The older I get, the more I value quiet mornings and peaceful nights.",

      "I stopped explaining myself to people who had already decided what to believe.",

      "Peace came when I accepted that some people will never understand my side.",

      "Sometimes the best response is no response.",

      "I would rather lose an argument than lose my peace.",

      "You can forgive someone without inviting them back into your life.",

      "Peace is not weakness. Sometimes it takes strength to remain calm.",

      "I stopped carrying conversations that were never mine to carry.",

      "Not everything deserves your attention.",

      "Some things become lighter when you stop talking about them.",

      "I am choosing peace over unnecessary explanations.",

      "There is nothing wrong with becoming quieter when life becomes louder.",

      "Sometimes leaving peacefully is more powerful than staying to prove a point.",

      "I don't need everyone around me. I need the right energy around me.",

      "Peace is when your happiness no longer depends on someone else's behavior.",

      "I stopped looking for peace in places that constantly disturbed me.",

      "Sometimes distance is the answer your heart was afraid to accept.",

      "You don't have to hate someone to let them go.",

      "My peace is something I protect now.",

      "I am learning that letting things be is also a form of strength.",

      "A peaceful life may look boring to some people, but to me it feels priceless."

    ];

    const quoteList = document.getElementById("quoteList");

    quotes.forEach((quote, index) => {

      const div = document.createElement("div");

      div.className = "quote";

      div.textContent = quote;

      div.onclick = () => openQuote(index);

      quoteList.appendChild(div);

    });

    let currentQuote = 0;

    function openQuote(index) {

      currentQuote = index;

      document.getElementById("fullQuote").textContent =
        quotes[currentQuote];

      document.getElementById("quoteNumber").textContent =
        "QUOTE " +
        String(currentQuote + 1).padStart(2, "0") +
        " OF " +
        quotes.length;

      document.getElementById("quoteScreen").style.display = "flex";

    }

    function closeQuote() {
      document.getElementById("quoteScreen").style.display = "none";
    }

    function nextQuote() {

      currentQuote++;

      if (currentQuote >= quotes.length) {
        currentQuote = 0;
      }

      openQuote(currentQuote);

    }

    function previousQuote() {

      currentQuote--;

      if (currentQuote < 0) {
        currentQuote = quotes.length - 1;
      }

      openQuote(currentQuote);

    }

  </script>

</body>
</html>
