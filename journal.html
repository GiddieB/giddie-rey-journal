<!DOCTYPE html>

<head>
  <meta charset="UTF-8">

  <title>Giddie Rey Journal</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      background: #080808;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .container {
      width: 100%;
      height: 100vh;
      max-width: 500px;
      margin: auto;
      padding: 20px;
      text-align: center;

      display: flex;
      flex-direction: column;
    }

    h1 {
      font-size: 34px;
      margin-top: 10px;
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    .intro {
      color: #aaa;
      line-height: 1.6;
      margin-bottom: 15px;
      flex-shrink: 0;
    }

    /* CATEGORY SCROLL AREA */
    .category-list {
      flex: 1;
      min-height: 0;

      overflow-y: scroll;

      padding: 5px 8px 20px;

      border: 1px solid #252525;
      border-radius: 18px;

      background: #0d0d0d;
    }

    /* VISIBLE SCROLLBAR */
    .category-list::-webkit-scrollbar {
      width: 7px;
    }

    .category-list::-webkit-scrollbar-track {
      background: #111;
      border-radius: 10px;
    }

    .category-list::-webkit-scrollbar-thumb {
      background: #555;
      border-radius: 10px;
    }

    .category {
      display: block;
      width: 100%;

      padding: 18px;
      margin: 10px 0;

      background: #151515;
      color: white;

      text-decoration: none;

      border: 1px solid #292929;
      border-radius: 14px;

      font-size: 17px;

      transition: 0.3s;
    }

    .category:active {
      transform: scale(0.98);
      background: #222;
    }

    .back {
      display: block;
      margin-top: 12px;
      padding: 10px;

      color: #999;
      text-decoration: none;

      flex-shrink: 0;
    }
  </style>
</head>
